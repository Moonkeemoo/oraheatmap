<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oralab · pnl heatmap</title>
<style>
@font-face { font-family: 'Space Grotesk'; src: url('fonts/SpaceGrotesk-400.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Space Grotesk'; src: url('fonts/SpaceGrotesk-500.ttf') format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Space Grotesk'; src: url('fonts/SpaceGrotesk-600.ttf') format('truetype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Space Grotesk'; src: url('fonts/SpaceGrotesk-700.ttf') format('truetype'); font-weight: 700; font-display: swap; }

:root {
  --bg: #0a0d12;
  --base: #0e1218;
  --line: #1a2030;
  --text: #e6eef7;
  --text-dim: #6b7a8f;
  --text-mid: #9aa8bd;
  --win: #3fb950;
  --win-text: #dcffe2;
  --loss: #f85149;
  --loss-text: #ffe2e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at top, #0d1219 0%, var(--bg) 60%);
  color: var(--text);
  font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: 12px;
  letter-spacing: 0.02em;
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  padding: 22px 28px 18px;
  gap: 16px;
  position: relative;
}

/* HEADER */
header.top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 28px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand img.logo { height: 36px; width: auto; display: block; }
.brand .sub {
  font-size: 9.5px; color: var(--text-dim);
  letter-spacing: 0.22em; text-transform: uppercase;
  border-left: 1px solid var(--line);
  padding-left: 14px;
  line-height: 1.5;
}
.headcenter { display: flex; gap: 10px; align-items: center; justify-content: center; }
.modechip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px;
  background: rgba(63, 185, 80, 0.07);
  border: 1px solid rgba(63, 185, 80, 0.22);
  border-radius: 3px;
  color: var(--win);
  font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
}
.live {
  display: inline-flex; align-items: center; gap: 7px;
  color: var(--win);
  font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500;
}
.live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--win); animation: pulse 1.4s infinite; box-shadow: 0 0 8px rgba(63, 185, 80, 0.7); }

.stats { display: flex; gap: 22px; }
.stat { display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-left: 14px; min-width: 100px; }
.stat .lbl { font-size: 9px; color: var(--text-dim); letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 4px; }
.stat .val { font-size: 19px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; transition: color 200ms; }
.stat .val.win { color: var(--win-text); }
.stat .val.loss { color: var(--loss-text); }
.stat .val.bump { animation: bump 320ms ease-out; }

/* GRID */
.gridarea {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 12px;
  overflow: hidden;
}
.labels { display: grid; grid-auto-rows: 1fr; gap: 3px; padding-top: 28px; }
.label {
  display: flex; align-items: center;
  font-size: 10px; color: var(--text-mid);
  letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
  transition: color 220ms, text-shadow 220ms;
}
.label.hot { color: var(--win); text-shadow: 0 0 12px rgba(63, 185, 80, 0.6); }
.label.cold { color: var(--loss); text-shadow: 0 0 12px rgba(248, 81, 73, 0.6); }
.heat { display: grid; grid-template-rows: 24px 1fr; overflow: hidden; }
.dayrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.day {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px; font-weight: 500;
}
.day.today { color: var(--win); border-bottom: 1px solid var(--win); }
.day.today .pip {
  width: 6px; height: 6px; background: var(--win); border-radius: 50%;
  margin-right: 7px; box-shadow: 0 0 6px rgba(63, 185, 80, 0.7);
  animation: pulse 1.4s infinite;
}
.gridwrap { position: relative; overflow: hidden; }
.todaytint {
  position: absolute;
  top: 0; bottom: 0;
  left: calc(144 / 168 * 100%);
  width: calc(24 / 168 * 100%);
  background: linear-gradient(180deg, rgba(63, 185, 80, 0.06), rgba(63, 185, 80, 0.02));
  pointer-events: none;
  border-left: 1px dashed rgba(63, 185, 80, 0.20);
}
.grid {
  display: grid;
  grid-template-columns: repeat(168, 1fr);
  grid-auto-rows: 1fr;
  gap: 1px;
  height: 100%;
}
.cell {
  background: var(--base);
  border-radius: 1px;
  position: relative;
  transition: background 200ms ease, transform 100ms;
}

/* === EXPRESSIVE HIGHLIGHTS === */
.cell.flash-bright {
  filter: brightness(2.1) saturate(1.3);
  transform: scaleY(1.3) scaleX(1.05);
  z-index: 4;
  box-shadow: 0 0 14px rgba(255,255,255,0.45);
}
.cell.flash-loss {
  filter: brightness(2) saturate(1.3);
  transform: scaleY(1.3) scaleX(1.05);
  z-index: 4;
  box-shadow: 0 0 14px rgba(248,81,73,0.55);
}
.cell.ripple {
  filter: brightness(1.55) saturate(1.15);
  z-index: 2;
  box-shadow: 0 0 8px rgba(255,255,255,0.2);
}
.cell.row-sweep {
  filter: brightness(1.85) saturate(1.2);
  transform: scaleY(1.18);
  z-index: 3;
}
.cell.col-sweep {
  filter: brightness(1.7) saturate(1.15);
  transform: scaleY(1.12);
  z-index: 3;
}
.cell.idle-flicker {
  animation: flicker 1.6s ease-in-out;
}

/* Sweep beam overlay — bright white bar that travels with the sweep */
.sweep-beam {
  position: absolute;
  pointer-events: none;
  z-index: 5;
}
.sweep-beam.row {
  height: calc(100% / 10);
  width: 14px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.85) 50%, transparent 100%);
  filter: blur(2px);
  mix-blend-mode: screen;
}
.sweep-beam.col {
  width: calc(100% / 168);
  height: 100%;
  background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.85) 50%, transparent 100%);
  filter: blur(2px);
  mix-blend-mode: screen;
}

.callout {
  position: absolute;
  background: rgba(8, 11, 16, 0.96);
  border: 1px solid var(--win);
  padding: 10px 14px;
  font-size: 11px;
  color: var(--text);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 28px rgba(63, 185, 80, 0.45);
  pointer-events: none;
  transform: translate(-50%, -120%) scale(0.92);
  border-radius: 3px;
  white-space: nowrap;
  z-index: 10;
  opacity: 0;
  transition: opacity 240ms, transform 280ms cubic-bezier(.2,1.4,.4,1);
}
.callout.loss { border-color: var(--loss); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 28px rgba(248, 81, 73, 0.45); }
.callout.show { opacity: 1; transform: translate(-50%, -135%) scale(1); }
.callout .clbl { font-size: 9px; color: var(--text-dim); letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; }
.callout .cval { font-weight: 700; color: var(--win-text); font-size: 15px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.callout.loss .cval { color: var(--loss-text); }
.callout::after {
  content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
  border: 7px solid transparent; border-top-color: var(--win);
}
.callout.loss::after { border-top-color: var(--loss); }

/* Screen flash for big events */
.screen-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background: radial-gradient(ellipse at center, rgba(63,185,80,0.18) 0%, transparent 60%);
  opacity: 0;
}
.screen-flash.show {
  animation: screenFlash 700ms ease-out;
}
.screen-flash.loss {
  background: radial-gradient(ellipse at center, rgba(248,81,73,0.22) 0%, transparent 60%);
}

/* TICKER */
footer.tape {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px;
  align-items: center;
}
.tape .lbl, .tape .rlbl {
  font-size: 9px; color: var(--text-dim); letter-spacing: 0.24em; text-transform: uppercase; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
}
.tape .rlbl .arrow { color: var(--win); }
.scroller { overflow: hidden; mask: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%); -webkit-mask: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%); }
.tape .row {
  display: flex; gap: 30px;
  white-space: nowrap;
  animation: scroll 24s linear infinite;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  width: max-content;
}
.tape .ev { display: inline-flex; gap: 9px; align-items: baseline; }
.tape .ev .who { color: var(--text-dim); font-size: 11px; }
.tape .ev .amt { font-weight: 600; }
.tape .ev .amt.win { color: var(--win-text); }
.tape .ev .amt.loss { color: var(--loss-text); }
.tape .ev .cat { color: var(--text-mid); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; }

@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
@keyframes flicker {
  0%, 100% { filter: brightness(1); }
  18% { filter: brightness(1.8); }
  32% { filter: brightness(0.85); }
  52% { filter: brightness(1.6); }
  72% { filter: brightness(0.95); }
}
@keyframes scanline {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.04; }
}
@keyframes bump {
  0% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-4px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes screenFlash {
  0% { opacity: 0; }
  20% { opacity: 1; }
  100% { opacity: 0; }
}
.app::before {
  content: ''; position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  pointer-events: none;
  animation: scanline 4s ease-in-out infinite;
  z-index: 100;
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img class="logo" src="fonts/logo-full-dark.png" alt="oralab">
      <div class="sub">pnl heatmap<br>who's actually winning</div>
    </div>

    <div class="headcenter">
      <div class="modechip">macro · 1H × WEEK · 168</div>
      <div class="live"><span class="dot"></span>live</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="lbl">Net PnL 24h</div>
        <div class="val win" id="stat-pnl">$0</div>
      </div>
      <div class="stat">
        <div class="lbl">Win rate</div>
        <div class="val" id="stat-wr">0%</div>
      </div>
      <div class="stat">
        <div class="lbl">Active Whales</div>
        <div class="val" id="stat-whales">0</div>
      </div>
    </div>
  </header>

  <div class="gridarea">
    <div class="labels" id="labels"></div>
    <div class="heat">
      <div class="dayrow" id="dayrow"></div>
      <div class="gridwrap" id="gridwrap">
        <div class="todaytint"></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>

  <footer class="tape">
    <div class="lbl">PnL Tape</div>
    <div class="scroller">
      <div class="row" id="tape"></div>
    </div>
    <div class="rlbl"><span class="arrow">▸</span> 1,504 wallets</div>
  </footer>

  <div class="screen-flash" id="screen-flash"></div>
</div>

<script>
(() => {
  const COLS = 168;
  const ROWS = 10;
  const CATS = ['Politics', 'Crypto', 'Sports', 'Culture', 'NFL', 'NBA', 'AI', 'Tech', 'Macro', 'Geo'];
  const TODAY_DAY_IDX = 6; // last of 7 days — week ends today
  const TODAY_END_COL = 168; // entire grid is past or today

  // ---------- BUILD DOM ----------
  const labelsEl = document.getElementById('labels');
  const labelEls = [];
  CATS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'label';
    el.textContent = c;
    labelsEl.appendChild(el);
    labelEls.push(el);
  });

  // 7 days ENDING today (FRI 08). So: SAT 02, SUN 03, MON 04, TUE 05, WED 06, THU 07, FRI 08
  const days = [
    { lbl: 'Sat 02', today: false },
    { lbl: 'Sun 03', today: false },
    { lbl: 'Mon 04', today: false },
    { lbl: 'Tue 05', today: false },
    { lbl: 'Wed 06', today: false },
    { lbl: 'Thu 07', today: false },
    { lbl: 'Fri 08', today: true },
  ];
  const dayrow = document.getElementById('dayrow');
  days.forEach(d => {
    const el = document.createElement('div');
    el.className = 'day' + (d.today ? ' today' : '');
    el.innerHTML = (d.today ? '<span class="pip"></span>' : '') + d.lbl;
    dayrow.appendChild(el);
  });

  const gridEl = document.getElementById('grid');
  const cells = [];
  const frag = document.createDocumentFragment();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      frag.appendChild(el);
      cells.push({ el, r, c, value: 0 });
    }
  }
  gridEl.appendChild(frag);

  // ---------- COLOR (matches dashboard exactly) ----------
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (n) => Math.floor(Math.random() * n);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // Composite rgba(63,185,80, alpha) over base #0e1218 (matches alpha formula from /lib/colors.ts)
  function pnlToBg(v) {
    const intensity = Math.abs(v);
    if (intensity < 0.04) return 'rgb(14,18,24)';
    const isPos = v > 0;
    const a = 0.08 + Math.pow(intensity, 0.7) * 0.77;
    const baseR = 0x0e, baseG = 0x12, baseB = 0x18;
    const colR = isPos ? 63 : 248;
    const colG = isPos ? 185 : 81;
    const colB = isPos ? 80 : 73;
    const r = Math.round(colR * a + baseR * (1 - a));
    const g = Math.round(colG * a + baseG * (1 - a));
    const b = Math.round(colB * a + baseB * (1 - a));
    return `rgb(${r},${g},${b})`;
  }

  function setCell(cell, v) {
    cell.value = clamp(v, -1, 1);
    cell.el.style.background = pnlToBg(cell.value);
  }

  function flashBright(cell, ms = 320, isLoss = false) {
    const cls = isLoss ? 'flash-loss' : 'flash-bright';
    cell.el.classList.add(cls);
    setTimeout(() => cell.el.classList.remove(cls), ms);
  }

  // ---------- PNL TAPE ----------
  const whaleNames = ['whale_a8f2', 'whale_b3c1', 'whale_d9e4', 'whale_71fc', 'whale_22ab', 'whale_5e0d', 'whale_c4f7', 'whale_8b1a', 'whale_e207', 'whale_3da6', 'whale_19d8', 'whale_f0a5'];
  const tapeCats = ['POLITICS', 'CRYPTO', 'SPORTS', 'CULTURE', 'NFL', 'NBA', 'AI', 'TECH', 'MACRO', 'GEO'];
  const tapeEl = document.getElementById('tape');
  function makeTapeRow() {
    const html = [];
    for (let i = 0; i < 26; i++) {
      const w = whaleNames[irand(whaleNames.length)];
      const isWin = Math.random() > 0.32;
      const amt = Math.floor(rand(180, 48000));
      const cat = tapeCats[irand(tapeCats.length)];
      html.push(`<span class="ev"><span class="who">${w}</span><span class="amt ${isWin?'win':'loss'}">${isWin?'+':'−'}$${amt.toLocaleString()}</span><span class="cat">${cat}</span></span>`);
    }
    return html.join('');
  }
  tapeEl.innerHTML = makeTapeRow() + makeTapeRow();

  // ---------- SCREEN FLASH ----------
  const screenFlashEl = document.getElementById('screen-flash');
  function screenFlash(isLoss = false) {
    screenFlashEl.classList.remove('show', 'loss');
    void screenFlashEl.offsetWidth;
    if (isLoss) screenFlashEl.classList.add('loss');
    screenFlashEl.classList.add('show');
  }

  // ---------- SWEEP BEAMS ----------
  const gridwrapEl = document.getElementById('gridwrap');
  function spawnRowBeam(r) {
    const beam = document.createElement('div');
    beam.className = 'sweep-beam row';
    beam.style.top = `calc(${r} * (100% / ${ROWS}))`;
    beam.style.left = '-2%';
    gridwrapEl.appendChild(beam);
    requestAnimationFrame(() => {
      beam.style.transition = 'left 1100ms cubic-bezier(.3,.0,.7,1)';
      beam.style.left = '102%';
    });
    setTimeout(() => beam.remove(), 1300);
  }
  function spawnColBeam(c) {
    const beam = document.createElement('div');
    beam.className = 'sweep-beam col';
    beam.style.left = `calc(${c} * (100% / ${COLS}))`;
    beam.style.top = '-4%';
    gridwrapEl.appendChild(beam);
    requestAnimationFrame(() => {
      beam.style.transition = 'top 750ms cubic-bezier(.3,.0,.7,1)';
      beam.style.top = '104%';
    });
    setTimeout(() => beam.remove(), 900);
  }

  // ---------- EVENTS ----------
  let events = [];

  function buildEvents() {
    events = [];

    // PHASE 1 (0-7s): WAVE FILL — sweep SAT 02 → end of TODAY (entire grid), col by col
    for (let c = 0; c < TODAY_END_COL; c++) {
      const at = lerp(300, 7000, c / TODAY_END_COL);
      for (let r = 0; r < ROWS; r++) {
        if (Math.random() < 0.62) {
          const isWin = Math.random() > 0.30;
          const mag = rand(0.3, isWin ? 0.95 : 0.85);
          events.push({
            at: at + rand(0, 80),
            kind: 'set', r, c,
            value: isWin ? mag : -mag
          });
        }
      }
    }

    // PHASE 2 (7-12s): row-sweeps with bright beam — top to bottom
    for (let r = 0; r < ROWS; r++) {
      events.push({ at: 7200 + r * 380, kind: 'row-sweep', r });
      for (let i = 0; i < 9; i++) {
        events.push({
          at: 7200 + r * 380 + rand(0, 380),
          kind: 'pulse', r, c: irand(TODAY_END_COL)
        });
      }
    }

    // PHASE 3 (12-17s): col-sweeps + dense pulses
    for (let i = 0; i < 11; i++) {
      const c = 4 + i * 14 + irand(10);
      if (c >= TODAY_END_COL) continue;
      events.push({ at: 12000 + i * 460, kind: 'col-sweep', c });
    }
    for (let i = 0; i < 110; i++) {
      events.push({
        at: lerp(12000, 17000, Math.random()),
        kind: 'pulse',
        r: irand(ROWS),
        c: irand(TODAY_END_COL)
      });
    }

    // PHASE 4 (17-24s): WHALE callouts — 2 wins + 1 BIG LOSS
    events.push({ at: 17400, kind: 'whale', r: 4, c: 156, label: 'whale_e207', amount: 48200, kind2: 'win' });
    events.push({ at: 19800, kind: 'whale', r: 7, c: 132, label: 'whale_b3c1', amount: -28400, kind2: 'loss' });
    events.push({ at: 22200, kind: 'whale', r: 1, c: 102, label: 'whale_a8f2', amount: 31700, kind2: 'win' });
    for (let i = 0; i < 90; i++) {
      events.push({
        at: lerp(17000, 24000, Math.random()),
        kind: 'pulse',
        r: irand(ROWS),
        c: irand(TODAY_END_COL)
      });
    }

    // PHASE 5 (24-30s): cooldown — flickers + soft pulses
    for (let i = 0; i < 36; i++) {
      events.push({
        at: lerp(24500, 29800, Math.random()),
        kind: 'pulse', soft: true,
        r: irand(ROWS),
        c: irand(TODAY_END_COL)
      });
    }
    for (let i = 0; i < 28; i++) {
      events.push({
        at: lerp(24500, 29800, Math.random()),
        kind: 'flicker',
        r: irand(ROWS),
        c: irand(TODAY_END_COL)
      });
    }

    events.sort((a, b) => a.at - b.at);
  }
  buildEvents();

  // ---------- ENGINE ----------
  const t0 = performance.now();
  let lastEventIdx = 0;
  let lastT = 0;
  let activeCallouts = [];

  function showCallout(cell, mainText, subText, isLoss = false) {
    const el = document.createElement('div');
    el.className = 'callout' + (isLoss ? ' loss' : '');
    el.innerHTML = `<div class="clbl">${subText}</div><div class="cval">${mainText}</div>`;
    cell.el.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    activeCallouts.push({ el, removeAt: performance.now() + 2400 });
  }

  function pulseCell(cell, soft = false) {
    let v = cell.value;
    if (Math.abs(v) < 0.05) {
      const isWin = Math.random() > 0.30;
      v = (isWin ? 1 : -1) * rand(0.45, soft ? 0.7 : 1);
    } else {
      const sign = v >= 0 ? 1 : -1;
      v = sign * Math.min(1, Math.abs(v) + rand(0.18, soft ? 0.28 : 0.5));
    }
    setCell(cell, v);
    flashBright(cell, soft ? 220 : 360, v < 0);
  }

  function rowSweep(r) {
    spawnRowBeam(r);
    for (let c = 0; c < TODAY_END_COL; c++) {
      setTimeout(() => {
        const cell = cells[r * COLS + c];
        if (!cell) return;
        cell.el.classList.add('row-sweep');
        setTimeout(() => cell.el.classList.remove('row-sweep'), 280);
      }, c * 6);
    }
    const lbl = labelEls[r];
    lbl.classList.add('hot');
    setTimeout(() => lbl.classList.remove('hot'), 1200);
  }

  function colSweep(c) {
    spawnColBeam(c);
    for (let r = 0; r < ROWS; r++) {
      setTimeout(() => {
        const cell = cells[r * COLS + c];
        if (!cell) return;
        cell.el.classList.add('col-sweep');
        if (Math.abs(cell.value) > 0.05) {
          const sign = cell.value >= 0 ? 1 : -1;
          setCell(cell, sign * Math.min(1, Math.abs(cell.value) + 0.22));
        }
        setTimeout(() => cell.el.classList.remove('col-sweep'), 320);
      }, r * 22);
    }
  }

  function ripple(cr, cc, radius = 5) {
    for (let ring = 1; ring <= radius; ring++) {
      setTimeout(() => {
        for (let dr = -ring; dr <= ring; dr++) {
          for (let dc = -ring; dc <= ring; dc++) {
            if (Math.max(Math.abs(dr), Math.abs(dc)) !== ring) continue;
            const nr = cr + dr, nc = cc + dc;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= TODAY_END_COL) continue;
            const cell = cells[nr * COLS + nc];
            cell.el.classList.add('ripple');
            setTimeout(() => cell.el.classList.remove('ripple'), 320);
            if (Math.abs(cell.value) > 0.05 && Math.random() < 0.6) {
              const sign = cell.value >= 0 ? 1 : -1;
              setCell(cell, sign * Math.min(1, Math.abs(cell.value) + 0.15));
            }
          }
        }
      }, ring * 100);
    }
  }

  function whaleEvent(e) {
    const cell = cells[e.r * COLS + e.c];
    const isLoss = e.kind2 === 'loss';
    const sign = isLoss ? -1 : 1;
    // 3x3 block
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = e.r + dr, nc = e.c + dc;
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= TODAY_END_COL) continue;
        const c = cells[nr * COLS + nc];
        setCell(c, sign * (dr === 0 && dc === 0 ? 1 : 0.85));
        flashBright(c, 520, isLoss);
      }
    }
    showCallout(cell, `${isLoss ? '−' : '+'}$${Math.abs(e.amount).toLocaleString()}`, `${isLoss ? 'Big loss' : 'Big trade'} · ${e.label}`, isLoss);
    ripple(e.r, e.c, 5);
    screenFlash(isLoss);
  }

  function flickerCell(cell) {
    cell.el.classList.add('idle-flicker');
    setTimeout(() => cell.el.classList.remove('idle-flicker'), 1700);
  }

  function resetLoop() {
    cells.forEach(cell => {
      cell.el.classList.remove('flash-bright', 'flash-loss', 'ripple', 'row-sweep', 'col-sweep', 'idle-flicker');
      setCell(cell, 0);
    });
    activeCallouts.forEach(c => c.el.remove());
    activeCallouts = [];
    document.querySelectorAll('.sweep-beam').forEach(b => b.remove());
    labelEls.forEach(l => l.classList.remove('hot', 'cold'));
    lastEventIdx = 0;
  }

  const elPnl = document.getElementById('stat-pnl');
  const elWr = document.getElementById('stat-wr');
  const elWhales = document.getElementById('stat-whales');
  let lastPnl = 0;

  function bumpStat(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function tick() {
    const now = performance.now();
    const t = (now - t0) % 30000;

    if (t < lastT) resetLoop();
    lastT = t;

    while (lastEventIdx < events.length && events[lastEventIdx].at <= t) {
      const e = events[lastEventIdx++];
      if (e.kind === 'set') {
        const cell = cells[e.r * COLS + e.c];
        setCell(cell, e.value);
        flashBright(cell, 220, e.value < 0);
      } else if (e.kind === 'pulse') {
        const cell = cells[e.r * COLS + e.c];
        pulseCell(cell, e.soft);
      } else if (e.kind === 'flicker') {
        const cell = cells[e.r * COLS + e.c];
        flickerCell(cell);
      } else if (e.kind === 'row-sweep') {
        rowSweep(e.r);
      } else if (e.kind === 'col-sweep') {
        colSweep(e.c);
      } else if (e.kind === 'whale') {
        whaleEvent(e);
      }
    }

    activeCallouts = activeCallouts.filter(c => {
      if (now > c.removeAt) {
        c.el.classList.remove('show');
        setTimeout(() => c.el.remove(), 300);
        return false;
      }
      return true;
    });

    // counters
    const phase01 = Math.min(1, t / 7000);
    let pnl = Math.floor(8200 + phase01 * 176200 + Math.sin(t / 380) * 90 + Math.sin(t / 1700) * 1800);
    // Dip during the loss whale (around 19.8s)
    if (t > 19500 && t < 22500) {
      pnl -= Math.floor(28400 * Math.min(1, (t - 19500) / 800));
    }
    const wr = Math.floor(54 + phase01 * 14 + Math.sin(t / 1100) * 1.5);
    const whales = Math.floor(12 + phase01 * 36 + Math.sin(t / 2400) * 3);

    if (pnl !== lastPnl && Math.abs(pnl - lastPnl) > 200) bumpStat(elPnl);
    lastPnl = pnl;
    elPnl.classList.toggle('loss', pnl < 0);
    elPnl.classList.toggle('win', pnl >= 0);
    elPnl.textContent = (pnl >= 0 ? '+$' : '−$') + Math.abs(pnl).toLocaleString();
    elWr.textContent = wr + '%';
    elWhales.textContent = whales;

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
