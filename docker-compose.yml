services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_DB: whale_heatmap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Localhost-only — no external exposure. In-network services use db:5432.
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrate.sql:/docker-entrypoint-initdb.d/001-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-changeme}@db:5432/whale_heatmap
      RTDS_WS_URL: ${RTDS_WS_URL:-wss://ws-live-data.polymarket.com}
      GAMMA_API_URL: ${GAMMA_API_URL:-https://gamma-api.polymarket.com}
      WS_PING_INTERVAL_MS: ${WS_PING_INTERVAL_MS:-20000}
      WS_PING_JITTER_MAX_MS: ${WS_PING_JITTER_MAX_MS:-5000}
      WS_HEARTBEAT_THRESHOLD_MS: ${WS_HEARTBEAT_THRESHOLD_MS:-30000}
      WS_DATA_SILENCE_THRESHOLD_MS: ${WS_DATA_SILENCE_THRESHOLD_MS:-45000}
      WS_DEAD_BOOK_BID_THRESHOLD: ${WS_DEAD_BOOK_BID_THRESHOLD:-0.02}
      GAMMA_CACHE_TTL_MS: ${GAMMA_CACHE_TTL_MS:-30000}
      WHALE_CORPUS_PATH: /app/data/whale_corpus.json
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      # Localhost-only — host Caddy reverse-proxies to here.
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data:ro

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Override at deploy time via `docker compose build --build-arg
        # NEXT_PUBLIC_API_URL=https://yourdomain` if not using oralab.xyz.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://oralab.xyz}
    restart: always
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
