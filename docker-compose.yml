services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_DB: whale_heatmap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrate.sql:/docker-entrypoint-initdb.d/001-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-changeme}@db:5432/whale_heatmap
      RTDS_WS_URL: ${RTDS_WS_URL:-wss://ws-live-data.polymarket.com}
      GAMMA_API_URL: ${GAMMA_API_URL:-https://gamma-api.polymarket.com}
      WS_PING_INTERVAL_MS: ${WS_PING_INTERVAL_MS:-20000}
      WS_PING_JITTER_MAX_MS: ${WS_PING_JITTER_MAX_MS:-5000}
      WS_HEARTBEAT_THRESHOLD_MS: ${WS_HEARTBEAT_THRESHOLD_MS:-30000}
      WS_DATA_SILENCE_THRESHOLD_MS: ${WS_DATA_SILENCE_THRESHOLD_MS:-45000}
      WS_DEAD_BOOK_BID_THRESHOLD: ${WS_DEAD_BOOK_BID_THRESHOLD:-0.02}
      GAMMA_CACHE_TTL_MS: ${GAMMA_CACHE_TTL_MS:-30000}
      WHALE_CORPUS_PATH: /app/data/whale_corpus.json
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data:ro

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
